<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 | 민경천 포트폴리오 (Admin Portal)</title>
  <meta name="description" content="민경천 포트폴리오 관리자 페이지 - 자기소개 수정 및 신규 작업물 등록 관리">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animation.css">

  <style>
    .admin-header {
      background: rgba(11, 14, 27, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--color-gold-primary);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-tab-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 1rem;
    }
    .admin-tab {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .admin-tab.active {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--color-gold-primary);
      color: var(--color-gold-primary);
      box-shadow: var(--shadow-gold-glow);
    }
    .admin-form-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      font-weight: 600;
      color: var(--color-gold-primary);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .form-control {
      background: rgba(11, 14, 27, 0.8);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition-smooth);
    }
    .form-control:focus {
      border-color: var(--color-cyan-accent);
      box-shadow: var(--shadow-cyan-glow);
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 모듈형 관리자 마운트 요소 -->
  <div id="admin-app"></div>

  <!-- 토스트 알림 메시지 컨테이너 -->
  <div id="toast" class="toast hidden">
    <i class="fa-solid fa-circle-check" style="color: var(--color-gold-primary);"></i>
    <span id="toast-msg">메시지</span>
  </div>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 관리자 모듈 앱 스크립트 -->
  <script type="module" src="js/adminApp.js"></script>
</body>
</html>
